<!DOCTYPE html> <html lang="kk"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Тіркелу — Qadam</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"> <link rel="stylesheet" href="style.css"> </head> <body> <button class="sidebar-toggle" id="sidebarToggle" aria-label="Мәзірді ашу" aria-expanded="false"> <span></span><span></span><span></span> </button> <div class="sidebar-backdrop" id="sidebarBackdrop"></div> <aside class="sidebar" id="sidebar"> <a class="brand" href="index.html"> <img src="logo-white.png" alt="Qadam логотипі" class="brand-logo"> <span>Qadam</span> </a> <ul class="side-links"> <li><a href="index.html">Басты бет</a></li> <li><a href="products.html">Тауарлар</a></li> <li><a href="#">Біз туралы</a></li> <li><a href="contact.html">Байланыс</a></li> </ul> <div class="side-auth"> <a href="login.html" class="btn-ghost-dark">Кіру</a> <a href="register.html" class="btn-solid">Тіркелу</a> </div> </aside> <div class="page-content"> <section class="auth-page"> <div class="auth-card"> <a class="brand" href="index.html"> <img src="logo-black.png" alt="Qadam логотипі" class="brand-logo"> <span>Qadam</span> </a> <h1>Тіркелу</h1> <h2>Жаңа аккаунт ашу үшін төмендегі форманы толтырыңыз</h2> <div id="formMessage" class="form-message" hidden></div> <form id="registerForm" novalidate> <div class="field"> <label for="fullName">Аты-жөніңіз</label> <input id="fullName" name="fullName" type="text" placeholder="Мысалы: Айбек Серік"> <span class="error-msg" id="fullNameError"></span> </div> <div class="field"> <label for="email">Электрондық пошта</label> <input id="email" name="email" type="email" placeholder="example@mail.com"> <span class="error-msg" id="emailError"></span> </div> <div class="field"> <label for="password">Құпиясөз</label> <input id="password" name="password" type="password" placeholder="Кемінде 8 таңба"> <small>Кемінде 8 таңба, бір бас әріп және бір сан болсын.</small> <span class="error-msg" id="passwordError"></span> </div> <div class="field"> <label for="confirmPassword">Құпиясөзді қайталаңыз</label> <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Құпиясөзді қайта енгізіңіз"> <span class="error-msg" id="confirmPasswordError"></span> </div> <div class="field-inline"> <input id="terms" name="terms" type="checkbox"> <label for="terms">Қолдану ережелерімен келісемін</label> </div> <span class="error-msg" id="termsError"></span> <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer; font-size:15px;">Тіркелу</button> </form> <p class="auth-switch">Аккаунтыңыз бар ма? <a href="login.html">Кіру</a></p> </div> </section> </div> <script src="site.js"></script> <script src="register.js"></script> </body> </html>
